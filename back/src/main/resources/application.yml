server:
  forward-headers-strategy: framework

spring:
  application:
    name: novelty-back
  config:
    import:
      - "optional:file:.env[.properties]"
      - "optional:file:../.env[.properties]"
      - "optional:file:back/.env[.properties]"
  datasource:
    url: "${DB_URL:jdbc:postgresql://localhost:5432/postgres}"
    username: "${DB_USERNAME}"
    password: "${DB_PASSWORD}"
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:3}
      minimum-idle: ${DB_POOL_MIN_IDLE:0}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:20000}      
  jackson:
    time-zone: Asia/Seoul

springdoc:
  paths-to-match: /api/**
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

novelty:
  cors:
    allowed-origin-patterns: "${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}"
  openai:
    api-key: "${OPENAI_API_KEY:}"
    model: "${OPENAI_MODEL:}"
    base-url: "${OPENAI_BASE_URL:https://api.openai.com/v1}"
