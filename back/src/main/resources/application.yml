spring:
  application:
    name: novelty-back
  datasource:
    url: "${DB_URL:jdbc:oracle:thin:@localhost:1521:XE}"
    username: "${DB_USERNAME}"
    password: "${DB_PASSWORD}"
    driver-class-name: oracle.jdbc.OracleDriver

springdoc:
  paths-to-match: /api/**
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
