name: novelty_app
description: Minimal Flutter frontend for Novelty.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  shared_preferences: ^2.5.5
  web: ^1.1.1
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  fonts:
    - family: Noto Sans KR
      fonts:
        - asset: assets/fonts/NotoSansKR/NotoSansKR-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansKR/NotoSansKR-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansKR/NotoSansKR-Bold.ttf
          weight: 700
  assets:
    - assets/config/nickname_banned_words.txt
    - assets/ui/
    - assets/world3d/
    - assets/world3d/assets/
    - assets/world3d/models/
