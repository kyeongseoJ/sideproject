<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="매일 작은 새로운 행동을 시작하는 Novelty">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="novelty_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Novelty</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #7234e0;
    }

    #novelty-web-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      background: #7234e0;
      transition: opacity 360ms cubic-bezier(0.4, 0, 1, 1);
    }

    #novelty-web-splash img {
      display: block;
      animation: novelty-breathe 900ms cubic-bezier(0.2, 0.6, 0.25, 1)
        infinite alternate;
    }

    #novelty-web-splash .symbol {
      width: 112px;
      height: 112px;
    }

    #novelty-web-splash .wordmark {
      width: 190px;
      height: auto;
    }

    #novelty-web-splash.is-hidden {
      opacity: 0;
      pointer-events: none;
    }

    @keyframes novelty-breathe {
      from { opacity: 0.72; transform: scale(0.94); }
      to { opacity: 1; transform: scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      #novelty-web-splash,
      #novelty-web-splash img {
        animation: none;
        transition: none;
      }
    }
  </style>
</head>
<body>
  <div id="novelty-web-splash" role="status" aria-label="Novelty 로딩 중">
    <img
      class="symbol"
      src="assets/assets/ui/Novelty_logo_white.png"
      alt=""
    >
    <img
      class="wordmark"
      src="assets/assets/ui/Novelty_logo_letter_white.png"
      alt="Novelty"
    >
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      const splash = document.getElementById('novelty-web-splash');
      if (!splash) return;
      splash.classList.add('is-hidden');
      window.setTimeout(function () { splash.remove(); }, 380);
    });
  </script>
</body>
</html>
